<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="ebdfy-app" content="sample" />
    <script type="module">
      import '/src/v1.ts'
      // Only the app's own frame may set the title, so this one must not show.
      ebdfy.title('From the sheet')
      document.querySelector('#done').addEventListener('click', () => {
        ebdfy.toast('Booked')
        ebdfy.closeModal()
      })
      // A toast with an Undo, whose handler shows that the sheet ran it and not the app.
      document.querySelector('#undoable').addEventListener('click', () => {
        ebdfy.toast('Booked', { action: { label: 'Undo', onAction: () => ebdfy.toast('Sheet undone') } })
      })
      // The same, from a page that closes its modal at once and so cannot run the Undo.
      document.querySelector('#keep').addEventListener('click', () => {
        ebdfy.toast('Kept', { action: { label: 'Undo', onAction: () => ebdfy.toast('Sheet undone') } })
        ebdfy.closeModal()
      })
      // A dark theme from the Admin shows in a toast, the one way this page can be heard.
      addEventListener('message', (event) => {
        if (event.data?.type === 'theme' && event.data.payload?.theme === 'dark') {
          setTimeout(() => ebdfy.toast(`Theme ${document.documentElement.dataset.theme}`))
        }
      })
      // The buttons show only once they and the bridge are listening, so a test cannot tap early.
      document.querySelector('#buttons').hidden = false
    </script>
  </head>
  <body>
    <p>Pathao, pickup tomorrow</p>
    <div id="buttons" hidden>
      <button type="button">Pathao</button>
      <button id="done" type="button">Book</button>
      <button id="undoable" type="button">Reserve</button>
      <button id="keep" type="button">Keep</button>
    </div>
  </body>
</html>
