<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="ebdfy-app" content="sample" />
    <script type="module">
      import '/src/v2.ts'
      const asked = new URLSearchParams(location.search)
      // Each title action counts its taps in a toast.
      const taps = {}
      const action = (label) => ({
        label,
        onAction() {
          taps[label] = (taps[label] ?? 0) + 1
          ebdfy.toast(`${label} ran ${taps[label]}`)
        },
      })
      const options = asked.has('actions') ? { actions: JSON.parse(asked.get('actions')).map(action) } : {}
      ebdfy.title(asked.get('title') ?? 'Orders', options)
      // With form, the page holds a save-bar form whose submit says in a toast what it sent.
      if (asked.has('form')) {
        document.body.innerHTML = '<form data-save-bar><input name="note" value="Call first" /></form>'
        const form = document.querySelector('form')
        form.addEventListener('submit', (event) => {
          event.preventDefault()
          ebdfy.toast(`Saved ${new FormData(form).get('note')}`)
        })
      }
    </script>
  </head>
  <body></body>
</html>
