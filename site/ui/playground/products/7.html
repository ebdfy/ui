<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <link rel="icon" href="data:," />
    <title>Jamdani Panjabi · Playground · ebdfy design system v2</title>
    <link
      rel="preload"
      href="%EB_CDN%/ui/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%EB_CDN%/ui/v2.css" />
    <link rel="stylesheet" href="%EB_CDN%/ui/v2-host.css" />
    <script type="module" src="%EB_CDN%/ui/v2-host.js"></script>
    <script type="module" src="%EB_CDN%/ui/v2.js"></script>
    <link rel="stylesheet" href="/playground.css" />
    <script>
      // The staff member's language, kept by this browser as the Admin keeps it for them, before
      // anything draws.
      try {
        document.documentElement.lang = localStorage.getItem('ebdfy-playground-lang') === 'bn' ? 'bn' : 'en'
      } catch {}
    </script>
  </head>
  <body>
    <e-admin-frame>
      %EB_ADMIN_CHROME%
      <!-- A product's page. Its More actions lists the Admin's own Duplicate, then the sample app's
           Translate placement, which opens the app's /translate on this product. The product's
           name is the store's own words, so Bangla keeps it. -->
      <e-admin-panel store="demo">
        <header class="record-header">
          <h1>Jamdani Panjabi</h1>
          <e-menu>
            <e-button slot="trigger"
              ><span data-bn="আরও অ্যাকশন">More actions</span><e-icon name="chevron-down"></e-icon
            ></e-button>
            <e-menu-item
              ><e-icon name="copy" size="20"></e-icon><span data-bn="ডুপ্লিকেট করুন">Duplicate</span></e-menu-item
            >
            <e-menu-item href="/playground/translate?id=prod_7"
              ><span class="e-tile" data-size="20" aria-hidden="true">S</span>Translate</e-menu-item
            >
          </e-menu>
        </header>
        <div class="admin-page">
          <e-card heading="Product" data-bn-heading="পণ্য">
            <e-thumbnail src="/files/jamdani-panjabi-white.jpg" alt="Jamdani Panjabi" size="large"></e-thumbnail>
            <e-text data-bn="৳৩,৪৫০ · স্টকে ১২টি">৳3,450 · 12 in stock</e-text>
          </e-card>
        </div>
      </e-admin-panel>
    </e-admin-frame>
    <script src="/playground.js"></script>
  </body>
</html>
