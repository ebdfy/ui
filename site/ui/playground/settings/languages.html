<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <link rel="icon" href="data:," />
    <title>Languages · Playground · ebdfy design system v2</title>
    <link
      rel="preload"
      href="%EB_CDN%/ui/fonts/geist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="%EB_CDN%/ui/v2.css" />
    <link rel="stylesheet" href="%EB_CDN%/ui/v2-host.css" />
    <script type="module" src="%EB_CDN%/ui/v2-host.js"></script>
    <script type="module" src="%EB_CDN%/ui/v2.js"></script>
    <link rel="stylesheet" href="/playground.css" />
    <script>
      // The staff member's language, kept by this browser as the Admin keeps it for them, before
      // anything draws.
      try {
        document.documentElement.lang = localStorage.getItem('ebdfy-playground-lang') === 'bn' ? 'bn' : 'en'
      } catch {}
    </script>
  </head>
  <body>
    <e-admin-frame>
      %EB_ADMIN_CHROME%
      <!-- An Admin page the playground names but does not fill. -->
      <e-admin-panel store="demo" menu="settings">
        <header><h1 data-bn="ভাষা">Languages</h1></header>
        <div class="admin-page">
          <e-text tone="subdued" data-bn="প্লেগ্রাউন্ডে এই পাতাটি এখনো ফাঁকা।"
            >This page is empty in the playground.</e-text
          >
        </div>
      </e-admin-panel>
    </e-admin-frame>
    <script src="/playground.js"></script>
  </body>
</html>
