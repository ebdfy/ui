<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Choice list · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Choice list</h1>
      <p>
        <code>eb-choice-list</code> is one pick from the <code>&lt;option&gt;</code> elements written inside it, drawn
        as radio buttons.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Default" caption-bn="সাধারণ">
          <eb-choice-list
            name="payment"
            data-state="default"
            label="Payment"
            data-label-en="Payment"
            data-label-bn="পেমেন্ট"
            ><option value="cod" data-en="Cash on delivery" data-bn="ক্যাশ অন ডেলিভারি">Cash on delivery</option>
            <option value="bkash" data-en="bKash" data-bn="বিকাশ">bKash</option></eb-choice-list
          >
        </docs-example>
        <docs-example caption="Focused" caption-bn="ফোকাসে">
          <eb-choice-list data-state="focus" label="Delivery" data-label-en="Delivery" data-label-bn="ডেলিভারি"
            ><option value="inside" data-en="Inside Dhaka" data-bn="ঢাকার ভেতরে">Inside Dhaka</option>
            <option value="outside" data-en="Outside Dhaka" data-bn="ঢাকার বাইরে">Outside Dhaka</option></eb-choice-list
          >
        </docs-example>
        <docs-example caption="With an error" caption-bn="ভুলসহ">
          <eb-choice-list
            data-state="error"
            required
            label="Payment"
            data-label-en="Payment"
            data-label-bn="পেমেন্ট"
            error="Choose how the customer pays."
            data-error-en="Choose how the customer pays."
            data-error-bn="ক্রেতা কীভাবে পরিশোধ করবেন বাছুন।"
            ><option value="cod" data-en="Cash on delivery" data-bn="ক্যাশ অন ডেলিভারি">Cash on delivery</option>
            <option value="bkash" data-en="bKash" data-bn="বিকাশ">bKash</option></eb-choice-list
          >
        </docs-example>
        <docs-example caption="Disabled" caption-bn="বন্ধ">
          <eb-choice-list
            data-state="disabled"
            value="bkash"
            disabled
            label="Payment"
            data-label-en="Payment"
            data-label-bn="পেমেন্ট"
            ><option value="cod" data-en="Cash on delivery" data-bn="ক্যাশ অন ডেলিভারি">Cash on delivery</option>
            <option value="bkash" data-en="bKash" data-bn="বিকাশ">bKash</option></eb-choice-list
          >
        </docs-example>
        <docs-example caption="Filled" caption-bn="পূরণ করা">
          <eb-choice-list
            data-state="filled"
            value="cod"
            label="Payment"
            data-label-en="Payment"
            data-label-bn="পেমেন্ট"
            ><option value="cod" data-en="Cash on delivery" data-bn="ক্যাশ অন ডেলিভারি">Cash on delivery</option>
            <option value="bkash" data-en="bKash" data-bn="বিকাশ">bKash</option></eb-choice-list
          >
        </docs-example>
      </div>
    </main>
  </body>
</html>
