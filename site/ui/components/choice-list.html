<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Choice list · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Choice list</h1>
      <p class="lede">
        <code>e-choice-list</code> is one pick from a few visible options. Write each choice as an <code>option</code>;
        the script turns it into a labelled radio, and the arrow keys move between them.
      </p>
      <docs-example caption="One pick" stack>
        <e-choice-list label="Delivery" name="delivery">
          <option value="inside" selected>Inside Dhaka, ৳60</option>
          <option value="outside">Outside Dhaka, ৳120</option>
          <option value="pickup">Pick up from the shop</option>
        </e-choice-list>
      </docs-example>
      <docs-example caption="With a help line under each label" stack>
        <e-choice-list label="Team" name="team">
          <option value="desk" help="Takes orders and calls customers" selected>Order desk</option>
          <option value="pack" help="Packs parcels and prints labels">Packing</option>
        </e-choice-list>
      </docs-example>
      <docs-example caption="A disabled choice" stack>
        <e-choice-list label="Payment" name="payment">
          <option value="cod" selected>Cash on delivery</option>
          <option value="bkash">bKash</option>
          <option value="card" disabled>Card, not for this order</option>
        </e-choice-list>
      </docs-example>
      <docs-example caption="With an error" stack>
        <e-choice-list label="Courier" name="courier" error="Choose a courier for order #1042.">
          <option value="pathao">Pathao</option>
          <option value="steadfast">Steadfast</option>
        </e-choice-list>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-choice-list label="ডেলিভারি" name="delivery">
          <option value="inside" selected>ঢাকার ভেতরে, ৳৬০</option>
          <option value="outside">ঢাকার বাইরে, ৳১২০</option>
        </e-choice-list>
      </docs-example>
    </main>
  </body>
</html>
