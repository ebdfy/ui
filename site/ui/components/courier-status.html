  <body>
    <main>
      <h1>Courier status</h1>
      <p>
        <code>eb-courier-status</code> shows what a courier says happened to a parcel. Its <code>status</code> is the
        courier's code, such as <code>IN_TRANSIT</code>; the element writes the words in the page's language and picks
        the badge tone itself. A code it does not know reads as unknown.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="The courier's status codes" caption-bn="কুরিয়ারের স্ট্যাটাস কোড">
          <eb-courier-status status="PENDING"></eb-courier-status>
          <eb-courier-status status="IN_TRANSIT"></eb-courier-status>
          <eb-courier-status status="OUT_FOR_DELIVERY"></eb-courier-status>
          <eb-courier-status status="DELIVERED"></eb-courier-status>
          <eb-courier-status status="RETURNED"></eb-courier-status>
        </docs-example>
      </div>
    </main>
  </body>
</html>
