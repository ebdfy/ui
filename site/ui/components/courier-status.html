<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Courier status · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Courier status</h1>
      <p class="lede">
        <code>e-courier-status</code> names where a parcel is, in the page's language, in a badge coloured by how it
        stands. <code>status</code> takes the kit's names or the courier API's codes.
      </p>
      <docs-example caption="Statuses">
        <e-courier-status status="awaiting-pickup"></e-courier-status>
        <e-courier-status status="with-courier"></e-courier-status>
        <e-courier-status status="delivered"></e-courier-status>
        <e-courier-status status="on-hold"></e-courier-status>
        <e-courier-status status="returned"></e-courier-status>
      </docs-example>
      <docs-example caption="The courier API's codes">
        <e-courier-status status="IN_TRANSIT"></e-courier-status>
        <e-courier-status status="OUT_FOR_DELIVERY"></e-courier-status>
        <e-courier-status status="ATTEMPT_FAILED"></e-courier-status>
      </docs-example>
      <docs-example caption="Beside an order">
        <e-text>Order #1042, Pathao: <e-courier-status status="out-for-delivery"></e-courier-status></e-text>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-courier-status status="with-courier"></e-courier-status>
        <e-courier-status status="delivered"></e-courier-status>
        <e-courier-status status="delivery-failed"></e-courier-status>
      </docs-example>
    </main>
  </body>
</html>
