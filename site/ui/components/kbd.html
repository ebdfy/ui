<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Kbd · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Kbd</h1>
      <p class="lede">
        <code>e-kbd</code> shows a keyboard shortcut as a key chip. Write the keys in <code>shortcut</code>, joined by
        <code>+</code>. <code>mod</code> reads Ctrl, or ⌘ on an Apple device.
      </p>
      <docs-example caption="Search">
        <e-stack direction="row" gap="2" align="center">
          <e-text>Search orders</e-text>
          <e-kbd shortcut="mod+k"></e-kbd>
        </e-stack>
      </docs-example>
      <docs-example caption="Three keys">
        <e-kbd shortcut="mod+shift+p"></e-kbd>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-stack direction="row" gap="2" align="center">
          <e-text>অর্ডার খুঁজুন</e-text>
          <e-kbd shortcut="mod+k"></e-kbd>
        </e-stack>
      </docs-example>
    </main>
  </body>
</html>
