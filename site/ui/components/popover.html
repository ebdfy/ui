<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Popover · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Popover</h1>
      <p>
        <code>eb-popover</code> opens a panel of any content below the <code>eb-button</code> in its
        <code>trigger</code> slot. Give it a <code>label</code> so a screen reader can name the panel. Escape or a press
        outside closes it.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="A panel of text" caption-bn="লেখার প্যানেল">
          <eb-popover label="Delivery note" data-label-en="Delivery note" data-label-bn="ডেলিভারি নোট">
            <eb-button slot="trigger" variant="secondary" data-en="Delivery note" data-bn="ডেলিভারি নোট"
              >Delivery note</eb-button
            >
            <p
              data-en="Call before you arrive. Leave the parcel with the guard if nobody answers."
              data-bn="পৌঁছানোর আগে ফোন করুন। কেউ না ধরলে পার্সেল গার্ডের কাছে রেখে যান।"
            >
              Call before you arrive. Leave the parcel with the guard if nobody answers.
            </p>
          </eb-popover>
        </docs-example>
      </div>
    </main>
  </body>
</html>
