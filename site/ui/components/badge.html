<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Badge · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Badge</h1>
      <p class="lede">
        <code>e-badge</code> tags an order with its status. The <code>tone</code> names the status. The words carry the
        meaning and the colour only repeats it, so always write the status in the badge.
      </p>
      <docs-example caption="The five statuses">
        <e-badge tone="new">New</e-badge>
        <e-badge tone="confirmed">Confirmed</e-badge>
        <e-badge tone="courier">With courier</e-badge>
        <e-badge tone="delivered">Delivered</e-badge>
        <e-badge tone="returned">Returned</e-badge>
      </docs-example>
      <docs-example caption="Without a tone the badge is neutral">
        <e-badge>Draft</e-badge>
      </docs-example>
      <docs-example caption="Beside an order" stack>
        <e-text>Order #1042 <e-badge tone="delivered">Delivered</e-badge></e-text>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-badge tone="new">নতুন</e-badge>
        <e-badge tone="confirmed">নিশ্চিত</e-badge>
        <e-badge tone="courier">কুরিয়ারে</e-badge>
        <e-badge tone="delivered">পৌঁছেছে</e-badge>
        <e-badge tone="returned">ফেরত</e-badge>
      </docs-example>
    </main>
  </body>
</html>
