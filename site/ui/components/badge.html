  <body>
    <main>
      <h1>Badge</h1>
      <p>
        <code>eb-badge</code> shows the status of an order as a dot and a word. The word carries the status; the
        <code>tone</code> only repeats it.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Order statuses" caption-bn="অর্ডারের অবস্থা">
          <eb-badge tone="attention" data-en="New" data-bn="নতুন">New</eb-badge>
          <eb-badge tone="critical" data-en="Returned" data-bn="ফেরত এসেছে">Returned</eb-badge>
          <eb-badge tone="info" data-en="Confirmed" data-bn="কনফার্মড">Confirmed</eb-badge>
          <eb-badge tone="shipped" data-en="Shipped" data-bn="পাঠানো হয়েছে">Shipped</eb-badge>
          <eb-badge tone="success" data-en="Paid" data-bn="পরিশোধিত">Paid</eb-badge>
        </docs-example>
      </div>
    </main>
  </body>
</html>
