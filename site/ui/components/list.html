  <head>
    <meta charset="utf-8" />

    <title>List · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>

  <body>
    <main>
      <h1>List</h1>
      <p>
        <code>eb-list</code> shows each child as a card, 12 px apart, on a screen of any width. Use it for short lists
        that are cards on every screen; for orders, which are a table on a computer, use <code>eb-table</code>.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Cards in a list" caption-bn="তালিকায় কার্ড" stack>
          <eb-list>
            <div data-en="Pathao picks up at 4 pm." data-bn="পাঠাও বিকেল ৪টায় নিয়ে যায়।">
              Pathao picks up at 4 pm.
            </div>
            <div data-en="Steadfast picks up at 6 pm." data-bn="স্টেডফাস্ট সন্ধ্যা ৬টায় নিয়ে যায়।">
              Steadfast picks up at 6 pm.
            </div>
            <div data-en="RedX picks up at noon." data-bn="রেডএক্স দুপুর ১২টায় নিয়ে যায়।">
              RedX picks up at noon.
            </div>
          </eb-list>
        </docs-example>
      </div>
    </main>
  </body>
</html>
