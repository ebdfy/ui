<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Switch · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Switch</h1>
      <p class="lede">
        <code>e-switch</code> is a setting that is on or off and takes effect at once. Its native checkbox has role
        switch and joins the form.
      </p>
      <docs-example caption="On and off" stack>
        <e-switch label="Notify me of new orders" name="notify" checked></e-switch>
        <e-switch label="Pause the shop" name="pause"></e-switch>
      </docs-example>
      <docs-example caption="Disabled" stack>
        <e-switch label="Cash on delivery" name="cod" checked disabled></e-switch>
      </docs-example>
      <docs-example caption="With an error" stack>
        <e-switch label="Auto-book Pathao" name="auto" error="Connect a Pathao account first."></e-switch>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-switch label="নতুন অর্ডারের বিজ্ঞপ্তি" name="notify" checked></e-switch>
        <e-switch label="দোকান বন্ধ রাখুন" name="pause"></e-switch>
      </docs-example>
    </main>
  </body>
</html>
