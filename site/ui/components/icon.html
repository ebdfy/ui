<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Icon · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Icon</h1>
      <p class="lede">
        <code>e-icon</code> draws a small icon from the kit's sprite. Pick it with <code>name</code>. It is 16 px, or 20
        px with <code>size="20"</code>. An icon is decorative, so name the button it sits in.
      </p>
      <docs-example caption="Two sizes">
        <e-stack direction="row" gap="3" align="center">
          <e-icon name="truck"></e-icon>
          <e-icon name="truck" size="20"></e-icon>
        </e-stack>
      </docs-example>
      <docs-example caption="Every icon in the sprite">
        <e-stack direction="row" gap="3" wrap>
          <e-icon name="truck" size="20"></e-icon>
          <e-icon name="search" size="20"></e-icon>
          <e-icon name="plus" size="20"></e-icon>
          <e-icon name="x" size="20"></e-icon>
          <e-icon name="check" size="20"></e-icon>
          <e-icon name="chevron-left" size="20"></e-icon>
          <e-icon name="chevron-right" size="20"></e-icon>
          <e-icon name="chevron-down" size="20"></e-icon>
          <e-icon name="more-horizontal" size="20"></e-icon>
          <e-icon name="home" size="20"></e-icon>
          <e-icon name="shopping-bag" size="20"></e-icon>
          <e-icon name="package" size="20"></e-icon>
          <e-icon name="users" size="20"></e-icon>
          <e-icon name="settings" size="20"></e-icon>
          <e-icon name="bell" size="20"></e-icon>
          <e-icon name="help" size="20"></e-icon>
        </e-stack>
      </docs-example>
      <docs-example caption="In a button">
        <e-button><e-icon name="plus"></e-icon> New order</e-button>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-button><e-icon name="truck"></e-icon> কুরিয়ার বুক করুন</e-button>
      </docs-example>
    </main>
  </body>
</html>
