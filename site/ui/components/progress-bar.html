<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Progress bar · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Progress bar</h1>
      <p class="lede">
        <code>e-progress-bar</code> shows how far a task has gone. <code>value</code> is a number from 0 to 100. Without
        a value the bar is indeterminate and a short fill slides along it. Set <code>label</code> to name it for a
        screen reader.
      </p>
      <docs-example caption="A value" stack>
        <e-progress-bar value="60" label="Orders imported"></e-progress-bar>
      </docs-example>
      <docs-example caption="No value: indeterminate" stack>
        <e-progress-bar label="Booking Pathao"></e-progress-bar>
      </docs-example>
      <docs-example caption="With the words beside it" stack>
        <e-text>৳2,450 of ৳5,000 collected</e-text>
        <e-progress-bar value="49" label="Collected"></e-progress-bar>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-text>৪০টির মধ্যে ২৪টি অর্ডার আমদানি হয়েছে</e-text>
        <e-progress-bar value="60" label="অর্ডার আমদানি"></e-progress-bar>
      </docs-example>
    </main>
  </body>
</html>
