<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Progress bar · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Progress bar</h1>
      <p>
        <code>eb-progress-bar</code> is a thin bar that fills the width of its row. <code>value</code> is 0 to 100 and
        sets how much of the bar is filled. With no <code>value</code> the bar is indeterminate: a block slides along it
        while the work goes on. <code>label</code> names the bar for a screen reader.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Determinate, 40 of 100" caption-bn="নির্দিষ্ট মাত্রা, ১০০-র মধ্যে ৪০" stack>
          <eb-progress-bar value="40" label="New orders" data-label-en="New orders" data-label-bn="নতুন অর্ডার">
          </eb-progress-bar>
        </docs-example>
        <docs-example caption="Indeterminate" caption-bn="অনির্দিষ্ট মাত্রা" stack>
          <eb-progress-bar
            label="Loading the order."
            data-label-en="Loading the order."
            data-label-bn="অর্ডার লোড হচ্ছে।"
          >
          </eb-progress-bar>
        </docs-example>
      </div>
    </main>
  </body>
</html>
