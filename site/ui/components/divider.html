<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Divider · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Divider</h1>
      <p class="lede">
        <code>e-divider</code> is a thin line across its row. Use it to separate two parts of a card or page.
      </p>
      <docs-example caption="Between two lines of text" stack>
        <e-stack gap="3">
          <e-text>Order #1042</e-text>
          <e-divider></e-divider>
          <e-text>Sent with Pathao</e-text>
        </e-stack>
      </docs-example>
      <docs-example caption="In a card" stack>
        <e-card heading="Payment">
          <e-stack gap="3">
            <e-text>Subtotal ৳1,170</e-text>
            <e-divider></e-divider>
            <e-text>Total ৳1,250</e-text>
          </e-stack>
        </e-card>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-stack gap="3">
          <e-text>অর্ডার #১০৪২</e-text>
          <e-divider></e-divider>
          <e-text>পাঠাও দিয়ে পাঠানো হয়েছে</e-text>
        </e-stack>
      </docs-example>
    </main>
  </body>
</html>
