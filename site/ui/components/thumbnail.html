<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Thumbnail · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Thumbnail</h1>
      <p class="lede">
        <code>e-thumbnail</code> is a fixed square for a product picture. Put an <code>img</code> inside, with its own
        <code>alt</code>. It is 40 px; <code>size</code> makes it small or large.
      </p>
      <docs-example caption="Three sizes">
        <e-thumbnail size="small"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23c8d6e5'/%3E%3C/svg%3E"
            alt="Cotton panjabi"
        /></e-thumbnail>
        <e-thumbnail
          ><img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23c8d6e5'/%3E%3C/svg%3E"
            alt="Cotton panjabi"
        /></e-thumbnail>
        <e-thumbnail size="large"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23c8d6e5'/%3E%3C/svg%3E"
            alt="Cotton panjabi"
        /></e-thumbnail>
      </docs-example>
      <docs-example caption="With no image">
        <e-thumbnail></e-thumbnail>
        <e-thumbnail size="large"></e-thumbnail>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-thumbnail size="large"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23c8d6e5'/%3E%3C/svg%3E"
            alt="সুতির পাঞ্জাবি"
        /></e-thumbnail>
      </docs-example>
    </main>
  </body>
</html>
