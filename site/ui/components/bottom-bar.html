  <body>
    <main>
      <h1>Bottom bar</h1>
      <p class="lede">
        <code>e-bottom-bar</code> holds a page's buttons at the end of a bar that sticks to the bottom of the page. On a
        phone each button takes an equal share.
      </p>
      <docs-example caption="Save and discard" stack>
        <e-bottom-bar>
          <e-button>Discard</e-button>
          <e-button tone="primary">Save</e-button>
        </e-bottom-bar>
      </docs-example>
      <docs-example caption="One button" stack>
        <e-bottom-bar>
          <e-button tone="primary">Book Pathao</e-button>
        </e-bottom-bar>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-bottom-bar>
          <e-button>বাতিল</e-button>
          <e-button tone="primary">সংরক্ষণ</e-button>
        </e-bottom-bar>
      </docs-example>
    </main>
  </body>
</html>
