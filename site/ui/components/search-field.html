<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Search field · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Search field</h1>
      <p class="lede">
        <code>e-search-field</code> is a one-line box with a search icon. It shows no label: <code>label</code> is the
        name a screen reader speaks.
      </p>
      <docs-example caption="Searching orders">
        <e-search-field label="Search orders" name="q" placeholder="Search orders"></e-search-field>
      </docs-example>
      <docs-example caption="With a value">
        <e-search-field label="Search customers" name="q" value="Rahim"></e-search-field>
      </docs-example>
      <docs-example caption="In a form with a submit button" stack>
        <form>
          <e-search-field label="Search by order number" name="order" placeholder="#1042"></e-search-field>
          <e-button type="submit">Search</e-button>
        </form>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-search-field label="অর্ডার খুঁজুন" name="q" placeholder="অর্ডার খুঁজুন"></e-search-field>
      </docs-example>
    </main>
  </body>
</html>
