<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Page · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
    <style>
      /* The example frame keeps the page from taking over this one: a short scrolling box. */
      .demo {
        display: block;
        padding: 0;
      }
      eb-page {
        min-height: 0;
        height: 360px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page</h1>
      <p>
        <code>eb-page</code> is the screen of an app: the page background, a <code>heading</code> and a column for its
        cards. The frame below keeps the example from taking over this page.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="A heading and cards" caption-bn="শিরোনাম ও কার্ড">
          <eb-page heading="Orders" data-heading-en="Orders" data-heading-bn="অর্ডার">
            <eb-card heading="Order 1042" data-heading-en="Order 1042" data-heading-bn="অর্ডার 1042">
              <p data-en="Two items, to be sent to Sylhet." data-bn="দুইটি পণ্য, সিলেটে পাঠাতে হবে।">
                Two items, to be sent to Sylhet.
              </p>
            </eb-card>
            <eb-card heading="Order 1043" data-heading-en="Order 1043" data-heading-bn="অর্ডার 1043">
              <p data-en="One item, to be sent to Dhaka." data-bn="একটি পণ্য, ঢাকায় পাঠাতে হবে।">
                One item, to be sent to Dhaka.
              </p>
              <eb-button data-en="Open" data-bn="খুলুন">Open</eb-button>
            </eb-card>
          </eb-page>
        </docs-example>
      </div>
    </main>
  </body>
</html>
