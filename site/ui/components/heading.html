<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Heading · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Heading</h1>
      <p class="lede">
        <code>e-heading</code> is a heading for a section of a page. Set <code>level</code> to <code>1</code>,
        <code>2</code> or <code>3</code>; without it the heading is level 2. Assistive tech reads it as a heading of
        that level.
      </p>
      <docs-example caption="Level 2, the default" stack>
        <e-heading>Recent orders</e-heading>
      </docs-example>
      <docs-example caption="The three levels" stack>
        <e-heading level="1">Order #1042</e-heading>
        <e-heading level="2">Delivery</e-heading>
        <e-heading level="3">Pathao, booked today</e-heading>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-heading level="1">অর্ডার #১০৪২</e-heading>
        <e-heading level="3">ঢাকা থেকে সিলেটে পাঠানো হবে</e-heading>
      </docs-example>
    </main>
  </body>
</html>
