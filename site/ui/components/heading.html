      <h1>Heading</h1>
      <p>
        <code>eb-heading</code> sets a title at level 1, 2 or 3. Pick the level for the outline of the page, not for the
        size you want.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Three levels" caption-bn="তিনটি ধাপ" stack>
          <eb-heading level="1" data-en="Orders" data-bn="অর্ডার">Orders</eb-heading>
          <eb-heading level="2" data-en="New orders" data-bn="নতুন অর্ডার">New orders</eb-heading>
          <eb-heading level="3" data-en="Sent to Sylhet" data-bn="সিলেটে পাঠানো">Sent to Sylhet</eb-heading>
        </docs-example>
