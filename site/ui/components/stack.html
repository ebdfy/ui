<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Stack · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Stack</h1>
      <p class="lede">
        <code>e-stack</code> lays its children out in a column with an even gap. Use <code>direction="row"</code> for a
        row, <code>gap</code> from 1 to 6 for the space, and <code>align</code> to line children up.
      </p>
      <docs-example caption="A column with a gap of 3" stack>
        <e-stack gap="3">
          <e-text>Order #1042</e-text>
          <e-text>Sylhet</e-text>
          <e-text tone="subdued">৳১,২৫০</e-text>
        </e-stack>
      </docs-example>
      <docs-example caption="A row that wraps">
        <e-stack direction="row" gap="1" wrap>
          <e-badge>Pathao</e-badge>
          <e-badge>Paid</e-badge>
          <e-badge>Dhaka</e-badge>
          <e-badge>Repeat customer</e-badge>
        </e-stack>
      </docs-example>
      <docs-example caption="A row aligned to the centre">
        <e-stack direction="row" gap="2" align="center">
          <e-icon name="truck"></e-icon>
          <e-text>On its way to Sylhet</e-text>
        </e-stack>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-stack gap="2">
          <e-text>অর্ডার #১০৪২</e-text>
          <e-text tone="subdued">সিলেট · ৳১,২৫০</e-text>
        </e-stack>
      </docs-example>
    </main>
  </body>
</html>
