<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Stack · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Stack</h1>
      <p>
        <code>eb-stack</code> puts its children in a column with the standard gap. Set <code>direction="row"</code> to
        put them side by side: they stay centred and wrap to a new line when the screen is narrow.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="A column" caption-bn="কলাম" stack>
          <eb-stack>
            <eb-text data-en="Two items, to be sent to Sylhet." data-bn="দুইটি পণ্য, সিলেটে পাঠাতে হবে।"
              >Two items, to be sent to Sylhet.</eb-text
            >
            <eb-text data-en="One item, to be sent to Dhaka." data-bn="একটি পণ্য, ঢাকায় পাঠাতে হবে।"
              >One item, to be sent to Dhaka.</eb-text
            >
          </eb-stack>
        </docs-example>
        <docs-example caption="A row" caption-bn="সারি" stack>
          <eb-stack direction="row">
            <eb-button data-en="Confirm" data-bn="কনফার্ম">Confirm</eb-button>
            <eb-button variant="secondary" data-en="Book courier" data-bn="কুরিয়ার বুক">Book courier</eb-button>
            <eb-button variant="ghost" data-en="Print labels" data-bn="লেবেল প্রিন্ট">Print labels</eb-button>
          </eb-stack>
        </docs-example>
      </div>
    </main>
  </body>
</html>
