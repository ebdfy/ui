<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Button · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Button</h1>
      <p class="lede">
        <code>e-button</code> runs one action. Use one primary button for the main action on a page or card.
      </p>
      <docs-example caption="Tones">
        <e-button tone="primary">Save</e-button>
        <e-button>Export</e-button>
        <e-button tone="plain">Cancel</e-button>
      </docs-example>
      <docs-example caption="Sizes">
        <e-button size="sm">Small</e-button>
        <e-button>Medium</e-button>
        <e-button size="lg">Large</e-button>
      </docs-example>
      <docs-example caption="With an icon">
        <e-button tone="primary"><e-icon name="plus"></e-icon>Create order</e-button>
        <e-button><e-icon name="truck"></e-icon>Book courier</e-button>
      </docs-example>
      <docs-example caption="Danger">
        <e-button tone="danger">Delete</e-button>
      </docs-example>
      <docs-example caption="Danger fill, in a confirm">
        <e-button tone="plain">Cancel</e-button>
        <e-button tone="danger" fill>Delete order</e-button>
      </docs-example>
      <docs-example caption="Icon only">
        <e-button icon aria-label="Print"><e-icon name="printer"></e-icon></e-button>
        <e-button icon aria-label="Close"><e-icon name="x"></e-icon></e-button>
      </docs-example>
      <docs-example caption="Disabled">
        <e-button tone="primary" disabled>Save</e-button>
        <e-button disabled>Export</e-button>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-button tone="primary">সংরক্ষণ করুন</e-button>
        <e-button>এক্সপোর্ট</e-button>
        <e-button tone="danger">বাতিল</e-button>
        <e-button tone="danger" fill>মুছুন</e-button>
        <e-button icon aria-label="প্রিন্ট"><e-icon name="printer"></e-icon></e-button>
      </docs-example>
    </main>
  </body>
</html>
