<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Date field · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Date field</h1>
      <p class="lede">
        <code>e-date-field</code> picks a day. It reads day month year in the page's language, "1 Nov 2026", and a press
        opens the browser's calendar. Its value is <code>YYYY-MM-DD</code>, and the form submits it the same way.
      </p>
      <docs-example caption="A labelled date">
        <e-date-field label="Delivery date" name="delivery"></e-date-field>
      </docs-example>
      <docs-example caption="With a value">
        <e-date-field label="Ordered on" name="ordered" value="2026-03-14"></e-date-field>
      </docs-example>
      <docs-example caption="Required, with an error">
        <e-date-field
          label="Pickup date"
          name="pickup"
          required
          error="Pick a day for the Pathao pickup."
        ></e-date-field>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-date-field label="ডেলিভারির তারিখ" name="delivery" value="2026-03-14"></e-date-field>
      </docs-example>
    </main>
  </body>
</html>
