<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="data:," />
    <title>Contact · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Contact</h1>
      <p class="lede">
        <code>e-contact</code> holds a <code>tel:</code> or <code>mailto:</code> link, so a tap calls or writes with or
        without the script. The script adds a copy button at the row's end; Copy writes the number the link names.
      </p>
      <docs-example caption="A phone number" stack>
        <e-contact><e-icon name="phone"></e-icon><a href="tel:01707071042">01707-071042</a></e-contact>
      </docs-example>
      <docs-example caption="An email address" stack>
        <e-contact><a href="mailto:rahima@example.com">rahima@example.com</a></e-contact>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-contact><e-icon name="phone"></e-icon><a href="tel:01707071042">01707-071042</a></e-contact>
      </docs-example>
    </main>
  </body>
</html>
