  <body>
    <header class="bar">
      <a href="/">ebdfy design system</a>
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" aria-pressed="true">System</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>

    <main>
      <h1>Link</h1>
      <p><code>eb-link</code> goes to another page. It takes the size of the sentence around it.</p>
      <div class="row" id="language">
        <eb-button data-lang="en">English</eb-button>
        <eb-button data-lang="bn">বাংলা</eb-button>
      </div>
      <div id="examples" lang="en">
        <p>
          <span data-en="Details are on the " data-bn="বিস্তারিত আছে ">Details are on the </span
          ><eb-link href="/components/button" data-en="Button page" data-bn="বোতামের পাতায়">Button page</eb-link
          ><span data-en="." data-bn="।">.</span>
        </p>
      </div>
      <pre><code>&lt;p&gt;Details are on the &lt;eb-link href="/components/button"&gt;Button page&lt;/eb-link&gt;.&lt;/p&gt;</code></pre>
    </main>
