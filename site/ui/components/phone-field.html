<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Phone field · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Phone field</h1>
      <p class="lede">
        <code>e-phone-field</code> takes a Bangladesh mobile number: 11 digits starting 01. Bangla digits turn Latin as
        they are typed, and the form says why a wrong number is refused.
      </p>
      <docs-example caption="A mobile number">
        <e-phone-field label="Customer phone" name="phone" placeholder="01XXXXXXXXX" required></e-phone-field>
      </docs-example>
      <docs-example caption="With a value">
        <e-phone-field label="Phone" name="phone" value="01712345678"></e-phone-field>
      </docs-example>
      <docs-example caption="In a form with a submit button" stack>
        <form>
          <e-phone-field label="Phone" name="phone" required></e-phone-field>
          <e-button type="submit" tone="primary">Save</e-button>
        </form>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-phone-field label="গ্রাহকের ফোন" name="phone" value="০১৭১২৩৪৫৬৭৮"></e-phone-field>
      </docs-example>
    </main>
  </body>
</html>
