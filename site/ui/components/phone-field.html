<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Phone field · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Phone field</h1>
      <p>
        <code>eb-phone-field</code> takes a Bangladesh mobile number: 11 digits starting with 01. It brings up the phone
        keypad and keeps the number in Latin digits, even when it is typed in Bangla digits.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Default" caption-bn="সাধারণ">
          <eb-phone-field
            name="phone"
            data-state="default"
            label="Phone"
            data-label-en="Phone"
            data-label-bn="ফোন"
          ></eb-phone-field>
        </docs-example>
        <docs-example caption="Focused" caption-bn="ফোকাসে">
          <eb-phone-field
            data-state="focus"
            label="Customer phone"
            data-label-en="Customer phone"
            data-label-bn="ক্রেতার ফোন"
          ></eb-phone-field>
        </docs-example>
        <docs-example caption="With an error" caption-bn="ভুলসহ">
          <eb-phone-field
            data-state="error"
            value="0170707"
            label="Phone"
            data-label-en="Phone"
            data-label-bn="ফোন"
            error="Enter an 11-digit phone starting with 01."
            data-error-en="Enter an 11-digit phone starting with 01."
            data-error-bn="এগারো সংখ্যার, 01 দিয়ে শুরু ফোন নম্বর লিখুন।"
          ></eb-phone-field>
        </docs-example>
        <docs-example caption="Disabled" caption-bn="বন্ধ">
          <eb-phone-field
            data-state="disabled"
            value="01911004471"
            disabled
            label="Phone"
            data-label-en="Phone"
            data-label-bn="ফোন"
          ></eb-phone-field>
        </docs-example>
        <docs-example caption="Filled" caption-bn="পূরণ করা">
          <eb-phone-field
            data-state="filled"
            value="01707071591"
            label="Phone"
            data-label-en="Phone"
            data-label-bn="ফোন"
          ></eb-phone-field>
        </docs-example>
      </div>
    </main>
  </body>
</html>
