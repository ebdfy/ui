<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Text field · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Text field</h1>
      <p>
        <code>eb-text-field</code> takes a line of text, such as a name or an email address. It joins its form like a
        native input, shows <code>help</code> under the field, and shows an <code>error</code> there with a red edge
        that keeps the focus ring.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Default" caption-bn="সাধারণ">
          <eb-text-field
            name="name"
            data-state="default"
            label="Customer"
            data-label-en="Customer"
            data-label-bn="ক্রেতা"
          ></eb-text-field>
        </docs-example>
        <docs-example caption="With help" caption-bn="সাহায্যসহ">
          <eb-text-field
            label="Recipient's name"
            data-label-en="Recipient's name"
            data-label-bn="প্রাপকের নাম"
            help="As it shows on the parcel"
            data-help-en="As it shows on the parcel"
            data-help-bn="পার্সেলে যেভাবে লেখা"
          ></eb-text-field>
        </docs-example>
        <docs-example caption="Focused" caption-bn="ফোকাসে">
          <eb-text-field
            data-state="focus"
            label="Note for the courier"
            data-label-en="Note for the courier"
            data-label-bn="কুরিয়ারের জন্য নোট"
          ></eb-text-field>
        </docs-example>
        <docs-example caption="With an error" caption-bn="ভুলসহ">
          <eb-text-field
            data-state="error"
            type="email"
            value="rahim@"
            label="Email"
            data-label-en="Email"
            data-label-bn="ইমেইল"
            error="Enter an email address like name@example.com."
            data-error-en="Enter an email address like name@example.com."
            data-error-bn="name@example.com এর মতো একটি ইমেইল ঠিকানা লিখুন।"
          ></eb-text-field>
        </docs-example>
        <docs-example caption="Disabled" caption-bn="বন্ধ">
          <eb-text-field
            data-state="disabled"
            value="1042"
            disabled
            label="Order number"
            data-label-en="Order number"
            data-label-bn="অর্ডার নম্বর"
          ></eb-text-field>
        </docs-example>
        <docs-example caption="Filled" caption-bn="পূরণ করা">
          <eb-text-field
            data-state="filled"
            label="Customer"
            data-label-en="Customer"
            data-label-bn="ক্রেতা"
            value="Rahim Uddin"
            data-value-en="Rahim Uddin"
            data-value-bn="রহিম উদ্দিন"
          ></eb-text-field>
        </docs-example>
      </div>
    </main>
  </body>
</html>
