<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Text field · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Text field</h1>
      <p class="lede">
        <code>e-text-field</code> takes one line of text. Its native input joins the form it sits in. Set
        <code>type</code> and <code>inputmode</code> for email, phone or URL keyboards.
      </p>
      <docs-example caption="A labelled field">
        <e-text-field label="Customer name" name="customer" placeholder="Rahim Uddin"></e-text-field>
      </docs-example>
      <docs-example caption="Email, required, with a value">
        <e-text-field label="Email" name="email" type="email" required value="rahim@example.com"></e-text-field>
      </docs-example>
      <docs-example caption="With an error">
        <e-text-field
          label="Shipping city"
          name="city"
          value="Sylhet"
          error="Enter a city we deliver to."
        ></e-text-field>
      </docs-example>
      <docs-example caption="In a form with a submit button" stack>
        <form>
          <e-text-field label="Customer name" name="customer" required></e-text-field>
          <e-text-field label="Email" name="email" type="email" autocomplete="email"></e-text-field>
          <e-button type="submit" tone="primary">Save customer</e-button>
        </form>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-text-field label="গ্রাহকের নাম" name="customer" placeholder="রহিম উদ্দিন"></e-text-field>
      </docs-example>
    </main>
  </body>
</html>
