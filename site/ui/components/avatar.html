<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Avatar · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Avatar</h1>
      <p class="lede">
        <code>e-avatar</code> is a 32 px circle for a person. Give it a <code>name</code> and it draws the first letter
        of the first and last word. An <code>img</code> inside covers the letters.
      </p>
      <docs-example caption="From a name">
        <e-avatar name="Rahima Akter"></e-avatar>
        <e-avatar name="Tanvir Hasan"></e-avatar>
        <e-avatar name="Nusrat"></e-avatar>
      </docs-example>
      <docs-example caption="With a picture">
        <e-avatar name="Rahima Akter"
          ><img
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='100%25' height='100%25' fill='%23c8d6e5'/%3E%3C/svg%3E"
            alt=""
        /></e-avatar>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-avatar name="রহিমা আক্তার"></e-avatar>
        <e-avatar name="তানভীর হাসান"></e-avatar>
      </docs-example>
    </main>
  </body>
</html>
