<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Empty state · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Empty state</h1>
      <p class="lede">
        <code>e-empty-state</code> fills a page or card that has nothing to show yet. Give it a <code>heading</code>, a
        line of text in a <code>p</code>, and an action with <code>slot="action"</code>.
      </p>
      <docs-example caption="Heading and text" stack>
        <e-empty-state heading="No orders yet">
          <p>Orders from your store appear here.</p>
        </e-empty-state>
      </docs-example>
      <docs-example caption="With an action" stack>
        <e-empty-state heading="No products in Sylhet">
          <p>Add a product to start selling.</p>
          <e-button slot="action" tone="primary">Add product</e-button>
        </e-empty-state>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-empty-state heading="এখনও কোনো অর্ডার নেই">
          <p>আপনার দোকানের অর্ডার এখানে দেখা যাবে।</p>
          <e-button slot="action" tone="primary">পণ্য যোগ করুন</e-button>
        </e-empty-state>
      </docs-example>
    </main>
  </body>
</html>
