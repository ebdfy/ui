<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Taka field · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Taka field</h1>
      <p class="lede">
        <code>e-taka-field</code> takes an amount in taka. It shows ৳ and the amount in the digits of the page's
        language with lakh grouping, and submits the plain number.
      </p>
      <docs-example caption="An amount">
        <e-taka-field label="Delivery charge" name="charge" value="60"></e-taka-field>
      </docs-example>
      <docs-example caption="Lakh grouping">
        <e-taka-field label="Order total" name="total" value="125000"></e-taka-field>
      </docs-example>
      <docs-example caption="With an error">
        <e-taka-field
          label="Refund"
          name="refund"
          value="1200"
          error="The refund cannot pass the order total."
        ></e-taka-field>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-taka-field label="অর্ডারের মোট" name="total" value="125000"></e-taka-field>
      </docs-example>
    </main>
  </body>
</html>
