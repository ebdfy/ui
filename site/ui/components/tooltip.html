  <body>
    <main>
      <h1>Tooltip</h1>
      <p>
        <code>eb-tooltip</code> shows a short <code>text</code> above the element inside it, on hover or keyboard focus.
        Escape closes it. When the element has no name of its own, such as an icon, the tooltip's text becomes its name
        and the keyboard can reach it.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Hover or focus the flag" caption-bn="পতাকায় হোভার বা ফোকাস করুন">
          <eb-tooltip text="High return risk" data-text-en="High return risk" data-text-bn="ফেরতের ঝুঁকি বেশি">
            <span role="img"><eb-icon name="triangle-alert"></eb-icon></span>
          </eb-tooltip>
        </docs-example>
      </div>
    </main>
  </body>
</html>
