<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Text area · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Text area</h1>
      <p class="lede">
        <code>e-text-area</code> takes several lines of text, such as an order note. Its native textarea joins the form,
        and <code>value</code> is the text it opens with. It opens four lines tall; <code>rows</code> asks for more.
      </p>
      <docs-example caption="A labelled text area">
        <e-text-area label="Order note" name="note" placeholder="Anything the courier should know"></e-text-area>
      </docs-example>
      <docs-example caption="Ten rows, for a policy">
        <e-text-area label="Refund policy" name="refund" rows="10"></e-text-area>
      </docs-example>
      <docs-example caption="With a value">
        <e-text-area
          label="Delivery note"
          name="delivery"
          value="Call before arriving. Gate 2, Mirpur 10, Dhaka."
        ></e-text-area>
      </docs-example>
      <docs-example caption="Required, with an error">
        <e-text-area
          label="Return reason"
          name="reason"
          required
          error="Tell us why order #1042 comes back."
        ></e-text-area>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-text-area label="অর্ডারের নোট" name="note" value="আসার আগে ফোন করবেন। মিরপুর ১০, ঢাকা।"></e-text-area>
      </docs-example>
    </main>
  </body>
</html>
