<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Text area · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Text area</h1>
      <p>
        <code>eb-text-area</code> takes a few lines of text, such as a note on an order. A person can drag it taller.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Default" caption-bn="সাধারণ">
          <eb-text-area
            name="note"
            data-state="default"
            label="Note"
            data-label-en="Note"
            data-label-bn="নোট"
          ></eb-text-area>
        </docs-example>
        <docs-example caption="Focused" caption-bn="ফোকাসে">
          <eb-text-area
            data-state="focus"
            label="Note for the courier"
            data-label-en="Note for the courier"
            data-label-bn="কুরিয়ারের জন্য নোট"
          ></eb-text-area>
        </docs-example>
        <docs-example caption="With an error" caption-bn="ভুলসহ">
          <eb-text-area
            data-state="error"
            required
            label="Reason for the return"
            data-label-en="Reason for the return"
            data-label-bn="ফেরতের কারণ"
            error="Say why the order came back."
            data-error-en="Say why the order came back."
            data-error-bn="অর্ডারটি কেন ফেরত এসেছে লিখুন।"
          ></eb-text-area>
        </docs-example>
        <docs-example caption="Disabled" caption-bn="বন্ধ">
          <eb-text-area
            data-state="disabled"
            disabled
            label="Note from the shop"
            data-label-en="Note from the shop"
            data-label-bn="দোকানের নোট"
            value="Gift wrap"
            data-value-en="Gift wrap"
            data-value-bn="গিফট র‍্যাপ"
          ></eb-text-area>
        </docs-example>
        <docs-example caption="Filled" caption-bn="পূরণ করা">
          <eb-text-area
            data-state="filled"
            label="Note"
            data-label-en="Note"
            data-label-bn="নোট"
            value="Call before delivery."
            data-value-en="Call before delivery."
            data-value-bn="ডেলিভারির আগে ফোন করুন।"
          ></eb-text-area>
        </docs-example>
      </div>
    </main>
  </body>
</html>
