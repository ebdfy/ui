<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>District picker · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>District picker</h1>
      <p>
        <code>eb-district-picker</code> picks one of the 64 districts and offers that district's upazilas and city
        thanas for the area, in the page's language. A <code>name</code> such as <code>address</code> submits
        <code>address.district</code> and <code>address.area</code>.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Default" caption-bn="সাধারণ">
          <eb-district-picker
            name="address"
            data-state="default"
            label="District"
            data-label-en="District"
            data-label-bn="জেলা"
          ></eb-district-picker>
        </docs-example>
        <docs-example caption="Focused" caption-bn="ফোকাসে">
          <eb-district-picker
            data-state="focus"
            label="Delivery district"
            data-label-en="Delivery district"
            data-label-bn="ডেলিভারির জেলা"
          ></eb-district-picker>
        </docs-example>
        <docs-example caption="With an error" caption-bn="ভুলসহ">
          <eb-district-picker
            data-state="error"
            required
            label="District"
            data-label-en="District"
            data-label-bn="জেলা"
            error="Choose a district."
            data-error-en="Choose a district."
            data-error-bn="একটি জেলা বাছুন।"
          ></eb-district-picker>
        </docs-example>
        <docs-example caption="Disabled" caption-bn="বন্ধ">
          <eb-district-picker
            data-state="disabled"
            district="Sylhet"
            area="Jalalabad"
            disabled
            label="District"
            data-label-en="District"
            data-label-bn="জেলা"
          ></eb-district-picker>
        </docs-example>
        <docs-example caption="Filled" caption-bn="পূরণ করা">
          <eb-district-picker
            data-state="filled"
            district="Dhaka"
            area="Mirpur"
            label="District"
            data-label-en="District"
            data-label-bn="জেলা"
          ></eb-district-picker>
        </docs-example>
      </div>
    </main>
  </body>
</html>
