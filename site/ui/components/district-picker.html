<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>District picker · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>District picker</h1>
      <p class="lede">
        <code>e-district-picker</code> chooses the district and upazila of a Bangladesh address. The upazila list
        follows the district, and each part submits its English name in lower case.
      </p>
      <docs-example caption="District and upazila" stack>
        <e-district-picker name="address"></e-district-picker>
      </docs-example>
      <docs-example caption="With an opening choice" stack>
        <e-district-picker name="address" district="dhaka" upazila="mirpur"></e-district-picker>
      </docs-example>
      <docs-example caption="With errors" stack>
        <e-district-picker
          name="address"
          error="Choose a district."
          upazila-error="Choose an upazila."
        ></e-district-picker>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-district-picker name="address" district="dhaka" upazila="mirpur"></e-district-picker>
      </docs-example>
    </main>
  </body>
</html>
