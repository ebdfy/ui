<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Card · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Card</h1>
      <p><code>eb-card</code> groups what belongs together on a surface. Give it a <code>heading</code> to title it.</p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Without a heading" caption-bn="শিরোনাম ছাড়া" stack>
          <eb-card>
            <p
              data-en="A card without a heading holds text and actions."
              data-bn="শিরোনামহীন কার্ডে লেখা ও কাজের বোতাম থাকে।"
            >
              A card without a heading holds text and actions.
            </p>
          </eb-card>
        </docs-example>
        <docs-example caption="With a heading and an action" caption-bn="শিরোনাম ও কাজসহ" stack>
          <eb-card heading="Order 1042" data-heading-en="Order 1042" data-heading-bn="অর্ডার 1042">
            <p data-en="Two items, to be sent to Sylhet." data-bn="দুইটি পণ্য, সিলেটে পাঠাতে হবে।">
              Two items, to be sent to Sylhet.
            </p>
            <p><span data-en="Total" data-bn="মোট">Total</span>: <span data-taka>৳1,25,000</span></p>
            <eb-button variant="primary" data-en="Add order" data-bn="অর্ডার যোগ করুন">Add order</eb-button>
          </eb-card>
        </docs-example>
      </div>
    </main>
  </body>
</html>
