<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Grid · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Grid</h1>
      <p class="lede">
        <code>e-grid</code> lays its children out in equal columns. It has one column below 600 px and two from 600 px.
        Set <code>columns</code> to 3 or 4 for more.
      </p>
      <docs-example caption="Two columns by default" stack>
        <e-grid>
          <e-card heading="Dhaka">
            <e-text>৳৮০</e-text>
          </e-card>
          <e-card heading="Outside Dhaka">
            <e-text>৳১৩০</e-text>
          </e-card>
        </e-grid>
      </docs-example>
      <docs-example caption="Three columns" stack>
        <e-grid columns="3">
          <e-card><e-text>Pending</e-text></e-card>
          <e-card><e-text>Sent</e-text></e-card>
          <e-card><e-text>Delivered</e-text></e-card>
        </e-grid>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-grid>
          <e-card heading="ঢাকা">
            <e-text>৳৮০</e-text>
          </e-card>
          <e-card heading="ঢাকার বাইরে">
            <e-text>৳১৩০</e-text>
          </e-card>
        </e-grid>
      </docs-example>
    </main>
  </body>
</html>
