<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Grid · ebdfy design system</title>
    <link rel="stylesheet" href="/docs.css" />
    <script src="/docs.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/components.js"></script>
  </head>
  <body>
    <main>
      <h1>Grid</h1>
      <p>
        <code>eb-grid</code> lays its children out in equal columns. Set <code>columns</code> to the number you want, 2
        by default. On a screen under 600 px wide it shows one column, whatever <code>columns</code> says.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Three columns" caption-bn="তিন কলাম" stack>
          <eb-grid columns="3">
            <eb-card>
              <eb-text data-en="New orders" data-bn="নতুন অর্ডার">New orders</eb-text>
            </eb-card>
            <eb-card>
              <eb-text data-en="Sent to Sylhet" data-bn="সিলেটে পাঠানো">Sent to Sylhet</eb-text>
            </eb-card>
            <eb-card>
              <eb-text data-en="Total" data-bn="মোট">Total</eb-text>
            </eb-card>
          </eb-grid>
        </docs-example>
      </div>
    </main>
  </body>
</html>
