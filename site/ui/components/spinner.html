  <body>
    <main>
      <h1>Spinner</h1>
      <p>
        <code>eb-spinner</code> is a 20 px ring that turns while something loads. It has no attributes. A screen reader
        hears "Loading", or "লোড হচ্ছে" on a Bangla page, from the language of the nearest <code>lang</code>.
      </p>
      <div id="examples" class="examples" lang="en">
        <docs-example caption="Beside the words it waits for" caption-bn="যার জন্য অপেক্ষা, তার পাশে">
          <eb-spinner></eb-spinner>
          <eb-text data-en="Loading the order." data-bn="অর্ডার লোড হচ্ছে।">Loading the order.</eb-text>
        </docs-example>
      </div>
    </main>
  </body>
