<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Button group · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Button group</h1>
      <p class="lede">
        <code>e-button-group</code> holds a row of <code>e-button</code>s where one is chosen. Mark the chosen button
        with <code>pressed</code>, and give each a <code>value</code> to read when the choice changes.
      </p>
      <docs-example caption="Joined buttons">
        <e-button-group label="Pages">
          <e-button value="previous">Previous</e-button>
          <e-button value="next">Next</e-button>
        </e-button-group>
      </docs-example>
      <docs-example caption="A segmented toggle">
        <e-button-group label="Range">
          <e-button value="day" pressed>Day</e-button>
          <e-button value="week">Week</e-button>
          <e-button value="month">Month</e-button>
        </e-button-group>
      </docs-example>
      <docs-example caption="A group with one button chosen">
        <e-button-group label="View">
          <e-button value="all" pressed>All</e-button>
          <e-button value="unpaid">Unpaid</e-button>
          <e-button value="sent">Sent</e-button>
        </e-button-group>
      </docs-example>
      <docs-example caption="With a disabled button">
        <e-button-group label="Courier">
          <e-button value="pathao" pressed>Pathao</e-button>
          <e-button value="steadfast">Steadfast</e-button>
          <e-button value="redx" disabled>RedX</e-button>
        </e-button-group>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-button-group label="ভাষা">
          <e-button value="bn" pressed>বাংলা</e-button>
          <e-button value="en">English</e-button>
        </e-button-group>
        <e-button-group label="পাতা">
          <e-button value="previous">আগের</e-button>
          <e-button value="next">পরের</e-button>
        </e-button-group>
        <e-button-group label="সময়">
          <e-button value="day" pressed>দিন</e-button>
          <e-button value="week">সপ্তাহ</e-button>
          <e-button value="month">মাস</e-button>
        </e-button-group>
      </docs-example>
    </main>
  </body>
</html>
