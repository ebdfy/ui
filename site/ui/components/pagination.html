<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Pagination · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Pagination</h1>
      <p class="lede">
        <code>e-pagination</code> shows a label and two buttons. It keeps no page number: set
        <code>has-previous</code> and <code>has-next</code> to enable the buttons, and listen for
        <code>e-previous</code> and <code>e-next</code>.
      </p>
      <docs-example caption="On the first page" stack>
        <e-pagination label="1–20 of 120" has-next></e-pagination>
      </docs-example>
      <docs-example caption="In the middle" stack>
        <e-pagination label="21–40 of 120" has-previous has-next></e-pagination>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-pagination label="২১–৪০, মোট ১২০" has-previous has-next></e-pagination>
      </docs-example>
    </main>
  </body>
</html>
