<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Checkbox · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Checkbox</h1>
      <p class="lede">
        <code>e-checkbox</code> is one yes or no choice. Its native checkbox joins the form, and the change event
        bubbles out of the tag.
      </p>
      <docs-example caption="Checked and unchecked" stack>
        <e-checkbox label="Send a confirmation SMS" name="sms" checked></e-checkbox>
        <e-checkbox label="Gift wrap" name="gift"></e-checkbox>
      </docs-example>
      <docs-example caption="Indeterminate and disabled" stack>
        <e-checkbox label="Select all orders" indeterminate></e-checkbox>
        <e-checkbox label="Order #1042 is shipped" checked disabled></e-checkbox>
      </docs-example>
      <docs-example caption="With the label hidden">
        <e-checkbox label="Select order #1042" name="order" value="1042" hide-label></e-checkbox>
      </docs-example>
      <docs-example caption="With an error" stack>
        <e-checkbox
          label="I accept the delivery terms"
          name="terms"
          error="Accept the terms to place the order."
        ></e-checkbox>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-checkbox label="নিশ্চিতকরণ এসএমএস পাঠান" name="sms" checked></e-checkbox>
        <e-checkbox label="উপহারের মোড়ক" name="gift"></e-checkbox>
      </docs-example>
    </main>
  </body>
</html>
