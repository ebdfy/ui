<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Select · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Select</h1>
      <p class="lede">
        <code>e-select</code> picks one value from the <code>option</code> elements written inside it. Its native select
        joins the form, and the change event bubbles out of the tag.
      </p>
      <docs-example caption="Options inside the tag">
        <e-select label="Courier" name="courier">
          <option value="pathao">Pathao</option>
          <option value="steadfast" selected>Steadfast</option>
          <option value="redx">RedX</option>
        </e-select>
      </docs-example>
      <docs-example caption="With the label hidden">
        <e-select label="Sort orders" name="sort" hide-label>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </e-select>
      </docs-example>
      <docs-example caption="Disabled, and with an error" stack>
        <e-select label="City" name="city" disabled>
          <option>Dhaka</option>
        </e-select>
        <e-select label="Payment" name="payment" error="Choose how order #1042 is paid.">
          <option value="">Choose one</option>
          <option value="cod">Cash on delivery</option>
          <option value="bkash">bKash</option>
        </e-select>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-select label="কুরিয়ার" name="courier">
          <option value="pathao">পাঠাও</option>
          <option value="steadfast">স্টেডফাস্ট</option>
        </e-select>
      </docs-example>
    </main>
  </body>
</html>
