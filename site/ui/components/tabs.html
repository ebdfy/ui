<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Tabs · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Tabs</h1>
      <p class="lede">
        <code>e-tabs</code> is a row of <code>e-tab</code>s, one for each view. Mark the current one with
        <code>selected</code>; choosing another moves the mark and fires <code>e-tab-change</code>. Add
        <code>count</code> to show a number after the label.
      </p>
      <docs-example caption="Tabs" stack>
        <e-tabs label="Order views">
          <e-tab value="all" selected>All</e-tab>
          <e-tab value="new">New</e-tab>
          <e-tab value="courier">With courier</e-tab>
        </e-tabs>
      </docs-example>
      <docs-example caption="Tabs with counts" stack>
        <e-tabs label="Order views">
          <e-tab value="all" count="120" selected>All</e-tab>
          <e-tab value="new" count="12">New</e-tab>
          <e-tab value="courier" count="54">With courier</e-tab>
          <e-tab value="returned" count="6">Returned</e-tab>
        </e-tabs>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn" stack>
        <e-tabs label="অর্ডারের ভিউ">
          <e-tab value="all" count="১২০" selected>সব</e-tab>
          <e-tab value="new" count="১২">নতুন</e-tab>
          <e-tab value="courier" count="৫৪">কুরিয়ারে</e-tab>
        </e-tabs>
      </docs-example>
    </main>
  </body>
</html>
