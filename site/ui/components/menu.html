<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Menu · ebdfy design system v2</title>
  </head>
  <body>
    <main>
      <h1>Menu</h1>
      <p class="lede">
        <code>e-menu</code> opens a list of <code>e-menu-item</code>s from the <code>e-button</code> marked
        <code>slot="trigger"</code>. Use <code>tone="danger"</code> on an item that deletes or cancels.
      </p>
      <docs-example caption="A menu of actions">
        <e-menu>
          <e-button slot="trigger">Actions</e-button>
          <e-menu-item>Print label</e-menu-item>
          <e-menu-item>Mark as sent</e-menu-item>
          <e-menu-item>Duplicate</e-menu-item>
        </e-menu>
      </docs-example>
      <docs-example caption="With a danger item">
        <e-menu>
          <e-button slot="trigger" tone="plain">Order #1042</e-button>
          <e-menu-item>Edit</e-menu-item>
          <e-menu-item tone="danger">Cancel order</e-menu-item>
        </e-menu>
      </docs-example>
      <docs-example caption="বাংলায়" lang="bn">
        <e-menu>
          <e-button slot="trigger">কাজ</e-button>
          <e-menu-item>লেবেল প্রিন্ট</e-menu-item>
          <e-menu-item tone="danger">অর্ডার বাতিল</e-menu-item>
        </e-menu>
      </docs-example>
    </main>
  </body>
</html>
