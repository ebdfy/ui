<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta name="ebdfy-app" content="sample" />
    <meta name="ebdfy-home" content="%EB_UI%/playground" />
    <title>Translate · Sample app · ebdfy</title>
    <link rel="stylesheet" href="%EB_CDN%/ui/v2.css" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: var(--e-color-panel);
      }
      @media (min-width: 600px) {
        body {
          padding: 24px 28px;
        }
      }
    </style>
    <script>
      {
        let lang = new URLSearchParams(location.search).get('lang')
        if (lang !== 'bn' && lang !== 'en') {
          try {
            lang = localStorage.getItem('ebdfy-sample-lang')
          } catch {
            lang = 'en'
          }
        }
        document.documentElement.lang = lang === 'bn' ? 'bn' : 'en'
      }
    </script>
    <script type="module" src="%EB_CDN%/ui/v2.js"></script>
  </head>
  <body>
    <!-- The sample app's Translate placement on a product's More actions. The Admin opens this page
         with the product's id, which the page reads from ebdfy.config. -->
    <e-card>
      <e-text id="translating"></e-text>
      <e-text id="placement" tone="subdued" size="meta"></e-text>
    </e-card>
    <script type="module">
      const bn = () => document.documentElement.lang === 'bn'
      const draw = () => {
        const { id, placement } = ebdfy.config
        ebdfy.title(bn() ? 'অনুবাদ' : 'Translate')
        document.querySelector('#translating').textContent = bn() ? `${id} অনুবাদ হচ্ছে` : `Translating ${id}`
        document.querySelector('#placement').textContent = placement
      }
      draw()
      addEventListener('ebdfy:context', ({ detail }) => {
        document.documentElement.lang = detail.language
        draw()
      })
    </script>
  </body>
</html>
