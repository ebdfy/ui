<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta name="ebdfy-app" content="sample" />
    <!-- Opened on its own, a page of the sample app goes to the playground with that page open. -->
    <meta name="ebdfy-home" content="%EB_UI%/playground" />
    <title>Sample app · ebdfy</title>
    <style>
      body {
        margin: 0;
      }
      .list,
      .pane,
      .order-column {
        display: flex;
        flex-direction: column;
        gap: var(--eb-space-gap);
      }
      .order-column {
        gap: 4px;
      }
      .order-row {
        display: flex;
        align-items: center;
        gap: var(--eb-space-gap);
      }
      .order-row > .order-column {
        flex: 1;
        min-width: 0;
      }
      /* The status tabs and the search share one row above the table; on a row too short for both
         the search goes under the tabs, which always show whole. A phone, which lists cards, leaves
         them out. */
      .toolbar {
        display: none;
      }
      .toolbar eb-tabs {
        flex: 1 0 auto;
      }
      .toolbar eb-search-field {
        flex: none;
        width: 200px;
      }
      @media (min-width: 600px) {
        .toolbar {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: var(--eb-space-gap);
        }
      }
      /* Under 640 px Add order floats at the screen's foot as the page's one primary action, with room
         under the last row to scroll clear of it, and steps aside while a selection raises the bulk
         bar there. */
      @media (max-width: 639.98px) {
        eb-page {
          padding-bottom: calc(var(--eb-size-target) + 2 * var(--eb-space-card));
        }
        eb-page > [slot='actions'] {
          position: fixed;
          inset-inline-end: var(--eb-space-card);
          bottom: calc(var(--eb-space-card) + env(safe-area-inset-bottom));
          z-index: 1;
        }
        eb-page:has(eb-bulk-bar:not([empty])) > [slot='actions'] {
          display: none;
        }
      }
      /* From 1040 px the open order shows beside the list, which keeps room for its six columns. */
      .pane {
        display: none;
      }
      @media (min-width: 1040px) {
        .orders {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 320px;
          align-items: start;
          gap: var(--eb-space-gap);
        }
        /* The pane scrolls with the page; its actions stick to the screen's foot while any of the
           order shows, so they are in reach however far it runs below. */
        .pane {
          display: flex;
        }
        .pane-content {
          display: flex;
          flex-direction: column;
          gap: var(--eb-space-gap);
        }
        .pane-actions {
          position: sticky;
          bottom: 0;
          padding-block: var(--eb-space-gap) var(--eb-space-card);
          background: var(--eb-color-bg);
        }
        .pane-actions > eb-button {
          flex: 1;
        }
      }
    </style>
    <script src="/lang.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/nav.js"></script>
    <script type="module">
      import { besidePane, confirmOrders, countOrders, listOrders, orderOf, showOrders } from '/orders.js'
      import { orderActions, showOrder } from '/order-detail.js'

      const copy = {
        bn: {
          title: 'অর্ডার',
          text: 'আপনার স্টোরের অর্ডার, নতুনগুলো আগে।',
          add: 'অর্ডার যোগ করুন',
          show: 'দেখুন',
          filters: { all: 'সব', new: 'নতুন', confirmed: 'কনফার্মড', courier: 'কুরিয়ারে', returned: 'ফেরত এসেছে' },
          search: 'অর্ডার খুঁজুন',
          actions: ['কনফার্ম', 'কুরিয়ার বুক', 'লেবেল প্রিন্ট'],
          done: [
            (n) => `${n}টি অর্ডার কনফার্ম হয়েছে`,
            (n) => `${n}টি অর্ডারের কুরিয়ার বুক হয়েছে`,
            (n) => `${n}টি লেবেল প্রিন্ট হচ্ছে`,
          ],
        },
        en: {
          title: 'Orders',
          text: 'Your store’s orders, newest first.',
          add: 'Add order',
          show: 'Show',
          filters: { all: 'All', new: 'New', confirmed: 'Confirmed', courier: 'With courier', returned: 'Returned' },
          search: 'Search orders',
          actions: ['Confirm', 'Book courier', 'Print labels'],
          done: [
            (n) => `Confirmed ${n} ${n === '1' ? 'order' : 'orders'}`,
            (n) => `Booked a courier for ${n} ${n === '1' ? 'order' : 'orders'}`,
            (n) => `Printing ${n} ${n === '1' ? 'label' : 'labels'}`,
          ],
        },
      }
      // The order shown beside the list, which the list marks open. A click on a row opens its order.
      let open = 1039
      ebdfy.title(copy[document.documentElement.lang].title)

      const header = document.querySelector('eb-page')
      const add = document.querySelector('eb-page > [slot="actions"]')
      const table = document.querySelector('eb-table')
      const pages = document.querySelector('eb-pagination')
      const bar = document.querySelector('eb-bulk-bar')
      const tabs = document.querySelector('.toolbar eb-tabs')
      const search = document.querySelector('.toolbar eb-search-field')
      const paneContent = document.querySelector('.pane-content')
      const paneActions = document.querySelector('.pane-actions')
      let result = { orders: [] }
      let page = 1
      let filter = 'all'
      let query = ''
      // Each load's number, so a slower answer to an older search never replaces a newer one.
      let loads = 0

      function draw() {
        const lang = document.documentElement.lang
        const t = copy[lang]
        header.setAttribute('heading', t.title)
        header.setAttribute('description', t.text)
        // Add order keeps its icon; only its words change.
        add.replaceChildren(add.querySelector('eb-icon'), t.add)
        table.label = t.title
        // Each action keeps its icon; only its words change.
        for (const [i, button] of [...bar.children].entries()) {
          button.replaceChildren(button.querySelector('eb-icon'), t.actions[i])
        }
        showOrders(table, result.orders, lang, open)
        bar.count = 0
        const counts = countOrders()
        tabs.label = t.show
        tabs.value = filter
        // A tab draws its count in the page's language, so it redraws with it, as the pagination does.
        for (const tab of tabs.children) {
          tab.textContent = t.filters[tab.value]
          tab.count = counts[tab.value]
          tab.requestUpdate()
        }
        search.label = t.search
        drawPane(lang)
        // The pagination names its buttons in the page's language, so it redraws with it.
        pages.requestUpdate()
      }

      function drawPane(lang) {
        const order = orderOf(open)
        showOrder(paneContent, lang, order, { pane: true })
        paneActions.replaceChildren(
          ...orderActions(lang, order, async () => {
            confirmOrders([order.number])
            result = await listOrders({ page, filter, query })
            draw()
          }),
        )
      }

      // Each row links to its order's page. Beside the pane the row's link opens the order there
      // instead, and keeps the list and its selection; Ctrl or Cmd still opens the page in a new tab.
      // A click on the row away from its link reaches here as the click eb-row sends to that link.
      table.addEventListener('click', (event) => {
        const path = event.composedPath()
        const row = path.find((el) => el.localName === 'eb-row')
        if (!besidePane.matches || !row || !path.some((el) => el.localName === 'a')) return
        if (event.ctrlKey || event.metaKey) return
        event.preventDefault()
        open = Number(row.dataset.number)
        for (const each of table.querySelectorAll('eb-row')) each.open = each === row
        drawPane(document.documentElement.lang)
      })

      table.addEventListener('eb-selection', () => {
        bar.count = table.selected.length
      })
      function clearSelection() {
        for (const row of table.selected) row.selected = false
        bar.count = 0
      }
      bar.addEventListener('eb-clear', clearSelection)
      for (const [i, button] of [...bar.children].entries()) {
        button.addEventListener('click', async () => {
          const lang = document.documentElement.lang
          const numbers = table.selected.map((row) => Number(row.dataset.number))
          ebdfy.toast(copy[lang].done[i](ebdfy.format.digits(numbers.length, lang)))
          if (i === 0) {
            confirmOrders(numbers)
            result = await listOrders({ page, filter, query })
            draw()
          } else clearSelection()
        })
      }

      async function load() {
        const call = ++loads
        table.loading = true
        const next = await listOrders({ page, filter, query })
        if (call !== loads) return
        result = next
        pages.hasPrevious = result.hasPrevious
        pages.hasNext = result.hasNext
        draw()
        table.loading = false
      }

      // A press on a language button keeps the choice (lang.js); the page draws in it.
      document.addEventListener('sample-lang', () => {
        ebdfy.title(copy[document.documentElement.lang].title)
        draw()
      })
      // The columns' shares change as the pane comes and goes.
      besidePane.addEventListener('change', draw)
      tabs.addEventListener('eb-change', (event) => {
        filter = event.detail.value
        page = 1
        load()
      })
      search.addEventListener('input', () => {
        query = search.value
        page = 1
        load()
      })
      pages.addEventListener('eb-previous', () => {
        page -= 1
        load()
      })
      pages.addEventListener('eb-next', () => {
        page += 1
        load()
      })
      load()
    </script>
  </head>
  <body>
    <eb-page heading="Orders" description="Your store’s orders, newest first.">
      <eb-button slot="actions" variant="primary"><eb-icon slot="icon" name="plus"></eb-icon>Add order</eb-button>
      <eb-stack>
        <eb-text variant="meta" data-store-name></eb-text>
        <eb-button-group segmented class="languages" label="Language">
          <eb-button data-lang="bn">বাংলা</eb-button>
          <eb-button data-lang="en">English</eb-button>
        </eb-button-group>
        <div class="orders">
          <div class="list">
            <div class="toolbar">
              <eb-tabs label="Show" value="all">
                <eb-tab value="all">All</eb-tab>
                <eb-tab value="new">New</eb-tab>
                <eb-tab value="confirmed">Confirmed</eb-tab>
                <eb-tab value="courier">With courier</eb-tab>
                <eb-tab value="returned">Returned</eb-tab>
              </eb-tabs>
              <eb-search-field label="Search orders" label-hidden></eb-search-field>
            </div>
            <eb-table label="Orders" selectable loading>
              <eb-column card="meta">Order</eb-column>
              <eb-column card="title">Customer</eb-column>
              <eb-column card="meta">Area</eb-column>
              <eb-column card="status">Status</eb-column>
              <eb-column card="meta">Payment</eb-column>
              <eb-column card="end">Total</eb-column>
            </eb-table>
            <eb-pagination></eb-pagination>
            <!-- Last in the list's column, the bar floats over the rows and covers nothing at the end. -->
            <eb-bulk-bar>
              <eb-button variant="ghost" size="sm"><eb-icon slot="icon" name="check"></eb-icon>Confirm</eb-button>
              <eb-button variant="ghost" size="sm"><eb-icon slot="icon" name="truck"></eb-icon>Book courier</eb-button>
              <eb-button variant="ghost" size="sm"
                ><eb-icon slot="icon" name="printer"></eb-icon>Print labels</eb-button
              >
            </eb-bulk-bar>
          </div>
          <aside class="pane">
            <div class="pane-content"></div>
            <div class="order-row pane-actions"></div>
          </aside>
        </div>
      </eb-stack>
    </eb-page>
  </body>
</html>
