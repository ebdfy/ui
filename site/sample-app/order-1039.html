<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta name="ebdfy-app" content="sample" />
    <!-- Opened on its own, a page of the sample app goes to the playground with that page open. -->
    <meta name="ebdfy-home" content="%EB_UI%/playground" />
    <title>Sample app · ebdfy</title>
    <style>
      body {
        margin: 0;
      }
      #order,
      .order-column {
        display: flex;
        flex-direction: column;
        gap: var(--eb-space-gap);
      }
      .order-column {
        gap: 4px;
      }
      .order-row {
        display: flex;
        align-items: center;
        gap: var(--eb-space-gap);
      }
      .order-row > .order-column {
        flex: 1;
        min-width: 0;
      }
      eb-bottom-bar > .order-row,
      eb-bottom-bar .order-row > eb-button {
        flex: 1;
      }
      /* The order's blocks stand 12 px apart. From 1024 px the customer moves to a column of its own
         on the right, a third of the width, beside the amount, the banner and the items. */
      #order-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: var(--eb-space-gap);
      }
      @media (min-width: 1024px) {
        #order-content {
          grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
        }
        #order-content > * {
          grid-column: 1;
        }
        #order-content > eb-card:has(eb-avatar) {
          grid-column: 2;
          grid-row: 1 / span 3;
        }
      }
      eb-bottom-bar[hidden] {
        display: none;
      }
      /* From 640 px the actions are in the Admin's title bar, so the bar at the foot goes. */
      @media (min-width: 640px) {
        eb-bottom-bar {
          display: none;
        }
      }
    </style>
    <script src="/lang.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/nav.js"></script>
    <script type="module">
      import { orderActionList, orderActions, orderTitle, showOrder } from '/order-detail.js'
      import { orderOf } from '/orders.js'

      // A row of the orders list opens this page at ?order=<number>; with none it shows #1039.
      const order = orderOf(Number(new URLSearchParams(location.search).get('order')) || 1039)
      const content = document.querySelector('#order-content')
      const bar = document.querySelector('eb-bottom-bar .order-row')

      // Where the actions go: the Admin's title bar from 640 px, the bar at the foot below.
      const wide = matchMedia('(min-width: 640px)')

      function draw() {
        const lang = document.documentElement.lang
        ebdfy.title(orderTitle(lang, order), { back: '/', actions: wide.matches ? orderActionList(lang, order) : [] })
        showOrder(content, lang, order)
        const actions = orderActions(lang, order)
        bar.replaceChildren(...actions)
        // An order that takes no action any more, such as one with the courier, needs no bar.
        bar.parentElement.toggleAttribute('hidden', actions.length === 0)
      }

      // A press on a language button keeps the choice (lang.js); the page draws in it.
      document.addEventListener('sample-lang', draw)
      wide.addEventListener('change', draw)
      draw()
    </script>
  </head>
  <body>
    <eb-page>
      <div id="order">
        <eb-button-group segmented class="languages" label="Language">
          <eb-button data-lang="bn">বাংলা</eb-button>
          <eb-button data-lang="en">English</eb-button>
        </eb-button-group>
        <div id="order-content"></div>
      </div>
    </eb-page>
    <!-- Outside the page's padding, so the two actions share the screen's width. -->
    <eb-bottom-bar><div class="order-row"></div></eb-bottom-bar>
  </body>
</html>
