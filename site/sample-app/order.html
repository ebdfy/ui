<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <meta name="ebdfy-app" content="sample" />
    <!-- Opened on its own, a page of the sample app goes to the playground with that page open. -->
    <meta name="ebdfy-home" content="%EB_UI%/playground" />
    <title>Sample app · ebdfy</title>
    <style>
      body {
        margin: 0;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: var(--eb-space-gap);
      }
    </style>
    <script src="/lang.js"></script>
    <script type="module" src="%EB_CDN%/ui/v1.js"></script>
    <script type="module" src="/nav.js"></script>
    <script type="module">
      const copy = {
        bn: {
          title: 'অর্ডার #1001',
          book: 'কুরিয়ার বুক করুন',
          more: 'আরও',
          print: 'প্রিন্ট',
          duplicate: 'ডুপ্লিকেট করুন',
          cancel: 'অর্ডার বাতিল করুন',
          printed: 'প্রিন্টারে পাঠানো হয়েছে',
          copied: 'নতুন খসড়ায় কপি হয়েছে',
          undo: 'ফিরিয়ে নিন',
          removed: 'খসড়া মুছে ফেলা হয়েছে',
          cancelled: 'অর্ডার বাতিল হয়েছে',
          refused: 'আপনি অর্ডার বাতিল করতে পারবেন না। স্টোরের মালিককে অনুমতি দিতে বলুন।',
          risk: 'এই নম্বরের ৫টি অর্ডারের ৩টি ফেরত এসেছে। ডেলিভারি চার্জ বিকাশে আগে নিন।',
          intro: 'অর্ডারটি বদলান, তারপর ওপরের বার থেকে সেভ বা বাতিল করুন।',
          saved: 'সেভ হয়েছে',
          badPhone: '০১ দিয়ে শুরু হওয়া ১১ অঙ্কের ফোন নম্বর দিন।',
          noArea: 'এলাকার নাম দিন।',
        },
        en: {
          title: 'Order #1001',
          book: 'Book courier',
          more: 'More',
          print: 'Print',
          duplicate: 'Duplicate',
          cancel: 'Cancel order',
          printed: 'Sent to the printer',
          copied: 'Copied to a new draft',
          undo: 'Undo',
          removed: 'Draft removed',
          cancelled: 'Order cancelled',
          refused: "You can't cancel orders. Ask the store owner to give you access.",
          risk: "3 of this number's 5 orders came back. Take the delivery charge in advance by bKash.",
          intro: 'Edit the order, then save or discard from the bar above.',
          saved: 'Saved',
          badPhone: 'Enter an 11-digit phone starting with 01.',
          noArea: 'Name the area.',
        },
      }
      const t = copy[document.documentElement.lang]

      document.querySelector('eb-banner').textContent = t.risk
      document.querySelector('#intro').textContent = t.intro

      // The demo staff member lacks write_orders, so the API refuses the cancel the app could make,
      // and the app says so in words a merchant can act on.
      async function cancelOrder() {
        const { errors } = await ebdfy.fetch('mutation { orderCancel(id: "ord_1001") { userErrors { message } } }')
        if (errors?.length) ebdfy.toast(t.refused, { error: true })
        else ebdfy.toast(t.cancelled)
      }
      // The draft is the app's to remove again, so the toast offers Undo.
      function duplicate() {
        ebdfy.toast(t.copied, { action: { label: t.undo, onAction: () => ebdfy.toast(t.removed) } })
      }
      ebdfy.title(t.title, {
        back: '/',
        actions: [
          { label: t.book, onAction: () => ebdfy.modal({ size: 'medium', src: '/book-courier', title: t.book }) },
          {
            label: t.more,
            items: [
              { label: t.print, onAction: () => ebdfy.toast(t.printed) },
              { label: t.duplicate, onAction: duplicate },
              { label: t.cancel, tone: 'critical', onAction: cancelOrder },
            ],
          },
        ],
      })
      // Alt+Shift+D runs Duplicate too; Ctrl+D is the browser's bookmark key. The key's code, since
      // Option on a Mac changes the letter it types.
      document.addEventListener('keydown', (event) => {
        if (event.code !== 'KeyD' || !event.altKey || !event.shiftKey || event.ctrlKey || event.metaKey) return
        event.preventDefault()
        duplicate()
      })

      // Stands in for the ebdfy API's order update, answering with the userErrors it gives.
      async function updateOrder(input) {
        await new Promise((resolve) => setTimeout(resolve, 300))
        const userErrors = []
        if (!/^01\d{9}$/.test(input.phone)) {
          userErrors.push({
            field: ['phone'],
            code: 'INVALID_PHONE',
            message: t.badPhone,
          })
        }
        if (!input.address.area.trim()) {
          userErrors.push({ field: ['address', 'area'], code: 'INVALID', message: t.noArea })
        }
        return { order: userErrors.length ? null : input, userErrors }
      }

      // address.area in the form is { address: { area } } in the API's input.
      function inputOf(form) {
        const input = {}
        for (const [name, value] of new FormData(form)) {
          const path = name.split('.')
          let at = input
          for (const key of path.slice(0, -1)) at = at[key] ??= {}
          at[path.at(-1)] = value
        }
        return input
      }

      const form = document.querySelector('#order')
      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        const { userErrors } = await updateOrder(inputOf(form))
        ebdfy.showErrors(form, userErrors)
        if (!userErrors.length) ebdfy.toast(t.saved)
      })
    </script>
  </head>
  <body>
    <eb-page>
      <eb-text variant="meta" data-store-name></eb-text>
      <eb-card>
        <eb-banner tone="danger"
          >3 of this number's 5 orders came back. Take the delivery charge in advance by bKash.</eb-banner
        >
        <p id="intro">Edit the order, then save or discard from the bar above.</p>
        <form id="order" data-save-bar novalidate>
          <eb-text-field name="name" label="Customer" value="Rahim Uddin"></eb-text-field>
          <eb-phone-field name="phone" label="Phone" value="01707071591"></eb-phone-field>
          <eb-district-picker name="address" district="Dhaka" area="Mirpur"></eb-district-picker>
          <eb-text-area name="note" label="Note" value="Call before delivery."></eb-text-area>
        </form>
        <!-- A plain script, so the form has its words before v1.js, a module, upgrades it and the save
             bar records the values it opened with. -->
        <script>
          if (document.documentElement.lang === 'bn') {
            const fields = {
              name: ['কাস্টমার', 'রহিম উদ্দিন'],
              phone: ['ফোন'],
              note: ['নোট', 'ডেলিভারির আগে ফোন করুন।'],
            }
            for (const [name, [label, value]] of Object.entries(fields)) {
              const field = document.querySelector(`[name="${name}"]`)
              field.setAttribute('label', label)
              if (value) field.setAttribute('value', value)
            }
          }
        </script>
      </eb-card>
    </eb-page>
  </body>
</html>
